name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp cache version into the service worker
        run: |
          V=$(cat index.html app.js i18n.js manifest.json icon-192.png icon-512.png fonts/* 2>/dev/null | sha256sum | cut -c1-8)
          sed -i "s/__BUILD__/$V/" sw.js
          grep "CACHE_NAME =" sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
